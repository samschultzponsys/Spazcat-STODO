<html lang="en">
<head>

<style>
@font-face {
  font-family: 'Ethnocentric';
  src: url('/fonts/ethnocentric_rg.otf') format('opentype');
  font-weight: normal; font-style: normal;
}
:root {
  --bg:      #0d0d0d;
  --panel:   #161616;
  --border:  #2a2a2a;
  --text:    #f0f0f0;
  --muted:   #888;
  --accent:  #5f249f;
  --accent-h:#7b30c9;
  --danger:  #ff3b3b;
  --mono:    'DM Mono', monospace;
  --disp:    'Ethnocentric', 'Orbitron', sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Orbitron:wght@700&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--mono);
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.card {
  width: 100%; max-width: 360px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px 24px;
}
.brand {
  font-family: var(--disp); font-size: 20px; letter-spacing: 2px;
  text-align: center; margin-bottom: 24px;
  color: #fff; -webkit-text-stroke: 2px var(--accent);
  paint-order: stroke fill; text-transform: uppercase;
}
label {
  display: block; font-size: 11px; color: var(--muted);
  letter-spacing: 1px; text-transform: uppercase; margin: 14px 0 5px;
}
input {
  width: 100%; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; font-family: var(--mono); font-size: 14px;
  outline: none; -webkit-appearance: none; transition: border-color .15s;
}
input:focus { border-color: var(--accent); }
.sign-in-btn {
  width: 100%; margin-top: 20px; padding: 11px;
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  font-family: var(--disp); font-size: 14px; letter-spacing: 1px;
  cursor: pointer; transition: background .15s;
}
.sign-in-btn:hover { background: var(--accent-h); }
.err {
  color: var(--danger); font-size: 12px; margin-top: 12px;
  min-height: 16px; text-align: center;
}
.token-hint {
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--muted); text-align: center; line-height: 1.5;
}
.token-hint a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand" id="brand">STODO</div>
  <label for="u">Username</label>
  <input id="u" type="text" autocomplete="username" autofocus>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password">
  <button class="sign-in-btn" id="go">SIGN IN</button>
  <div class="err" id="err"></div>
  <div class="token-hint" id="token-hint" style="display:none">
    Have an access token? Add it to your URL as <code>?token=YOUR_TOKEN</code>
  </div>
</div>
<script>
async function loadConfig() {
  try {
    const cfg = await fetch('/api/config').then(r => r.json());
    if (cfg.app_title) document.getElementById('brand').textContent = cfg.app_title;
    if (cfg.has_token) {
      document.getElementById('token-hint').style.display = 'block';
    }
  } catch(e) {}
}
loadConfig();

const err = document.getElementById('err');
async function submit() {
  err.textContent = '';
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  if (!username || !password) { err.textContent = 'Enter username and password'; return; }
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password})
    });
    const d = await r.json();
    if (d.ok) {
      // Small delay ensures the Set-Cookie is committed before navigating
      await new Promise(res => setTimeout(res, 150));
      window.location.replace('/');
    }
    else { err.textContent = d.error || 'Sign in failed'; }
  } catch(e) { err.textContent = 'Network error'; }
}
document.getElementById('go').addEventListener('click', submit);
document.querySelectorAll('input').forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
</script>
</body>
</html>
